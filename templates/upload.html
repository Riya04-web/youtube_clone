<!DOCTYPE html>
<html>

<head>

    <title>Upload Video</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body class="{{ 'dark-theme' if session.get('theme')=='dark' else 'light-theme' }}">

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a href="/" class="navbar-brand fw-bold">
            🎥 YouTube Clone
        </a>

        <a href="/" class="btn btn-light">
            ⬅ Home
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg">

                <div class="card-header bg-danger text-white">

                    <h3 class="mb-0">
                        📤 Upload New Video
                    </h3>

                </div>


                <div class="card-body">

                    <form
                        method="POST"
                        id="uploadForm">


                        <!-- TITLE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Video Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Enter video title"
                                required>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Describe your video..."
                                required></textarea>

                        </div>


                        <!-- VIDEO -->

                        <div class="mb-3">

                            <label class="form-label">
                                Select Video
                            </label>

                            <input
    type="file"
    id="videoFile"
    class="form-control"
    accept="video/*"
    required>

<div class="form-text">
    📌 Maximum video size: <strong>100 MB</strong>
</div>

<div
    id="videoSizeError"
    class="alert alert-warning mt-2 d-none">
</div>

                        </div>


                        <!-- PREMIUM -->

                        <div class="form-check mt-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="premium"
                                id="premium">

                            <label
                                class="form-check-label"
                                for="premium">

                                🔒 Premium Video

                            </label>

                        </div>


                        <!-- THUMBNAIL -->

                        <div class="mb-4 mt-3">

                            <label class="form-label">
                                Thumbnail Image
                            </label>

                            <input
                                type="file"
                                id="thumbnailFile"
                                class="form-control"
                                accept="image/*"
                                required>

                        </div>


                        <!-- PROGRESS -->

                        <div
                            id="uploadStatus"
                            class="alert alert-info d-none">

                            Preparing upload...

                        </div>


                        <div
                            class="progress mb-3 d-none"
                            id="progressContainer">

                            <div
                                id="progressBar"
                                class="progress-bar progress-bar-striped progress-bar-animated"
                                role="progressbar"
                                style="width: 0%">

                                0%

                            </div>

                        </div>


                        <!-- HIDDEN CLOUDINARY URLS -->

                        <input
                            type="hidden"
                            name="video_url"
                            id="videoUrl">

                        <input
                            type="hidden"
                            name="thumbnail_url"
                            id="thumbnailUrl">


                        <button
                            type="submit"
                            id="uploadButton"
                            class="btn btn-danger w-100">

                            🚀 Upload Video

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const form = document.getElementById("uploadForm");

const videoFile = document.getElementById("videoFile");
const videoSizeError =
    document.getElementById("videoSizeError");

const MAX_VIDEO_SIZE = 100 * 1024 * 1024; // 100 MB


videoFile.addEventListener("change", function() {

    const video = videoFile.files[0];

    if (video && video.size > MAX_VIDEO_SIZE) {

    showStatus(
        "⚠️ Please select a video of 100 MB or less.",
        "warning"
    );

    return;
}

    if (!video) {
        videoSizeError.classList.add("d-none");
        return;
    }

    if (video.size > MAX_VIDEO_SIZE) {

        const sizeMB =
            (video.size / (1024 * 1024)).toFixed(1);

        videoSizeError.textContent =
            `⚠️ This video is ${sizeMB} MB. ` +
            `Please select a video of 100 MB or less.`;

        videoSizeError.classList.remove("d-none");

        videoFile.value = "";

    }
    else {

        videoSizeError.classList.add("d-none");

    }

});
const thumbnailFile = document.getElementById("thumbnailFile");

const videoUrl = document.getElementById("videoUrl");
const thumbnailUrl = document.getElementById("thumbnailUrl");

const uploadButton = document.getElementById("uploadButton");
const uploadStatus = document.getElementById("uploadStatus");

const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");


function showStatus(message, type = "info") {

    uploadStatus.className = "alert alert-" + type;
    uploadStatus.textContent = message;
    uploadStatus.classList.remove("d-none");

}


async function getSignature() {

    const response = await fetch("/cloudinary_signature");

    if (!response.ok) {
        throw new Error("Could not get Cloudinary signature.");
    }

    return await response.json();

}


/* =========================================================
   NORMAL CLOUDINARY UPLOAD
   Used for thumbnail
========================================================= */

function uploadToCloudinary(file, signatureData, resourceType) {

    return new Promise((resolve, reject) => {

        const xhr = new XMLHttpRequest();

        const uploadUrl =
            `https://api.cloudinary.com/v1_1/${signatureData.cloud_name}/${resourceType}/upload`;

        xhr.open("POST", uploadUrl);

        xhr.upload.addEventListener("progress", function(event) {

            if (event.lengthComputable) {

                const percent =
                    Math.round((event.loaded / event.total) * 100);

                progressBar.style.width = percent + "%";
                progressBar.textContent = percent + "%";

            }

        });

        xhr.onload = function() {

            if (xhr.status >= 200 && xhr.status < 300) {

                try {

                    const result =
                        JSON.parse(xhr.responseText);

                    resolve(result);

                }
                catch (error) {

                    reject(
                        new Error(
                            "Invalid response from Cloudinary."
                        )
                    );

                }

            }
            else {

                reject(
                    new Error(
                        "Cloudinary upload failed: " +
                        xhr.responseText
                    )
                );

            }

        };

        xhr.onerror = function() {

            reject(
                new Error(
                    "Network error while uploading."
                )
            );

        };

        const formData = new FormData();

        formData.append("file", file);

        formData.append(
            "api_key",
            signatureData.api_key
        );

        formData.append(
            "timestamp",
            signatureData.timestamp
        );

        formData.append(
            "signature",
            signatureData.signature
        );

        xhr.send(formData);

    });

}


/* =========================================================
   CHUNKED VIDEO UPLOAD
========================================================= */

function uploadVideoInChunks(file) {

    return new Promise(async (resolve, reject) => {

        const chunkSize = 6 * 1024 * 1024; // 6 MB
        const totalSize = file.size;

        let start = 0;
        let chunkNumber = 0;

        const uniqueUploadId = crypto.randomUUID();

        try {

            while (start < totalSize) {

                const end = Math.min(
                    start + chunkSize,
                    totalSize
                );

                const chunk = file.slice(start, end);

                chunkNumber++;

                showStatus(
                    `🎥 Uploading video... Chunk ${chunkNumber}`
                );

                /*
                 * Get a fresh Cloudinary signature
                 * for this chunk.
                 */

                const chunkSignature =
                    await getSignature();


                await new Promise((chunkResolve, chunkReject) => {

                    const xhr = new XMLHttpRequest();

                    const uploadUrl =
                        `https://api.cloudinary.com/v1_1/${chunkSignature.cloud_name}/video/upload`;


                    xhr.open("POST", uploadUrl);


                    /*
                     * Identify this chunked upload
                     */

                    xhr.setRequestHeader(
                        "X-Unique-Upload-Id",
                        uniqueUploadId
                    );


                    /*
                     * Tell Cloudinary which bytes
                     * this chunk contains.
                     */

                    xhr.setRequestHeader(
                        "Content-Range",
                        `bytes ${start}-${end - 1}/${totalSize}`
                    );


                    /*
                     * Progress
                     */

                    xhr.upload.addEventListener(
                        "progress",
                        function(event) {

                            if (event.lengthComputable) {

                                const chunkPercent =
                                    event.loaded / event.total;

                                const overallPercent =
                                    Math.round(
                                        (
                                            (
                                                start +
                                                (
                                                    chunkPercent *
                                                    (end - start)
                                                )
                                            ) /
                                            totalSize
                                        ) * 100
                                    );

                                progressBar.style.width =
                                    overallPercent + "%";

                                progressBar.textContent =
                                    overallPercent + "%";

                            }

                        }
                    );


                    /*
                     * Response
                     */

                    xhr.onload = function() {

                        if (
                            xhr.status >= 200 &&
                            xhr.status < 300
                        ) {

                            try {

                                const result =
                                    JSON.parse(
                                        xhr.responseText
                                    );


                                /*
                                 * Last chunk should return
                                 * the final Cloudinary result.
                                 */

                                if (end >= totalSize) {

                                    if (!result.secure_url) {

                                        chunkReject(
                                            new Error(
                                                "Cloudinary did not return a video URL."
                                            )
                                        );

                                        return;
                                    }


                                    chunkResolve();

                                    resolve(result);

                                }
                                else {

                                    chunkResolve();

                                }

                            }
                            catch (error) {

                                chunkReject(
                                    new Error(
                                        "Invalid response from Cloudinary."
                                    )
                                );

                            }

                        }
                        else {

                            chunkReject(
                                new Error(
                                    "Cloudinary chunk upload failed: " +
                                    xhr.responseText
                                )
                            );

                        }

                    };


                    /*
                     * Network error
                     */

                    xhr.onerror = function() {

                        chunkReject(
                            new Error(
                                "Network error while uploading video chunk."
                            )
                        );

                    };


                    /*
                     * Prepare request
                     */

                    const formData =
                        new FormData();


                    formData.append(
                        "file",
                        chunk,
                        file.name
                    );


                    formData.append(
                        "api_key",
                        chunkSignature.api_key
                    );


                    formData.append(
                        "timestamp",
                        chunkSignature.timestamp
                    );


                    formData.append(
                        "signature",
                        chunkSignature.signature
                    );


                    xhr.send(formData);

                });


                /*
                 * Move to next chunk
                 */

                start = end;

            }

        }
        catch (error) {

            reject(error);

        }

    });

}


/* =========================================================
   FORM SUBMISSION
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const video =
            videoFile.files[0];

        const thumbnail =
            thumbnailFile.files[0];


        if (!video) {

            alert("Please select a video.");

            return;

        }


        if (!thumbnail) {

            alert("Please select a thumbnail.");

            return;

        }


        try {

            uploadButton.disabled = true;

            progressContainer.classList.remove("d-none");


            /* ============================================
               GET VIDEO SIGNATURE
            ============================================ */

            showStatus(
                "🔐 Preparing secure Cloudinary upload..."
            )


            /* ============================================
               CHUNKED VIDEO UPLOAD
            ============================================ */

            progressBar.style.width = "0%";
            progressBar.textContent = "0%";


            const videoResult =
    await uploadVideoInChunks(video);


            if (!videoResult.secure_url) {

                throw new Error(
                    "Cloudinary did not return a video URL."
                );

            }


            videoUrl.value =
                videoResult.secure_url;


            /* ============================================
               THUMBNAIL
            ============================================ */

            showStatus(
                "🖼 Uploading thumbnail..."
            );


            progressBar.style.width = "0%";
            progressBar.textContent = "0%";


            const thumbnailSignature =
                await getSignature();


            const thumbnailResult =
                await uploadToCloudinary(
                    thumbnail,
                    thumbnailSignature,
                    "image"
                );


            if (!thumbnailResult.secure_url) {

                throw new Error(
                    "Cloudinary did not return a thumbnail URL."
                );

            }


            thumbnailUrl.value =
                thumbnailResult.secure_url;


            /* ============================================
               SEND ONLY TEXT + CLOUDINARY URLS
            ============================================ */

            showStatus(
                "💾 Saving video information..."
            );


            /*
             * VERY IMPORTANT:
             *
             * Disable the actual file inputs.
             *
             * Otherwise form.submit() would send
             * the 202 MB video to Vercel again.
             */

            videoFile.disabled = true;
            thumbnailFile.disabled = true;


            progressBar.style.width = "100%";
            progressBar.textContent = "100%";


            form.submit();

        }
        catch (error) {

            console.error(error);

            showStatus(
                "❌ Upload failed: " + error.message,
                "danger"
            );

            uploadButton.disabled = false;

        }

    }
);

</script>


</body>

</html>

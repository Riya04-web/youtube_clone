<!DOCTYPE html>
<html>

<head>

    <title>Upload Video</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body class="{{ 'dark-theme' if session.get('theme')=='dark' else 'light-theme' }}">

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a href="/" class="navbar-brand fw-bold">
            🎥 YouTube Clone
        </a>

        <a href="/" class="btn btn-light">
            ⬅ Home
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg">

                <div class="card-header bg-danger text-white">

                    <h3 class="mb-0">
                        📤 Upload New Video
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">

                            <label class="form-label">
                                Video Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Enter video title"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Describe your video..."
                                required></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Select Video
                            </label>

                            <input
                                type="file"
                                name="video"
                                class="form-control"
                                accept="video/*"
                                required>

                        </div>

                        <div class="form-check mt-3">

<input 
class="form-check-input"
type="checkbox"
name="premium"
id="premium">

<label class="form-check-label" for="premium">

🔒 Premium Video

</label>

</div>

                        <div class="mb-4">

                            <label class="form-label">
                                Thumbnail Image
                            </label>

                            <input
                                type="file"
                                name="thumbnail"
                                class="form-control"
                                accept="image/*"
                                required>

                        </div>

                        <button class="btn btn-danger w-100">

                            🚀 Upload Video

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>

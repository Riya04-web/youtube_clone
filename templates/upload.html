<!DOCTYPE html>
<html>

<head>

    <title>Upload Video</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body class="{{ 'dark-theme' if session.get('theme')=='dark' else 'light-theme' }}">

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a href="/" class="navbar-brand fw-bold">
            🎥 YouTube Clone
        </a>

        <a href="/" class="btn btn-light">
            ⬅ Home
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg">

                <div class="card-header bg-danger text-white">

                    <h3 class="mb-0">
                        📤 Upload New Video
                    </h3>

                </div>


                <div class="card-body">

                    <form
                        method="POST"
                        id="uploadForm">


                        <!-- TITLE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Video Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Enter video title"
                                required>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Describe your video..."
                                required></textarea>

                        </div>


                        <!-- VIDEO -->

                        <div class="mb-3">

                            <label class="form-label">
                                Select Video
                            </label>

                            <input
                                type="file"
                                id="videoFile"
                                class="form-control"
                                accept="video/*"
                                required>

                        </div>


                        <!-- PREMIUM -->

                        <div class="form-check mt-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="premium"
                                id="premium">

                            <label
                                class="form-check-label"
                                for="premium">

                                🔒 Premium Video

                            </label>

                        </div>


                        <!-- THUMBNAIL -->

                        <div class="mb-4 mt-3">

                            <label class="form-label">
                                Thumbnail Image
                            </label>

                            <input
                                type="file"
                                id="thumbnailFile"
                                class="form-control"
                                accept="image/*"
                                required>

                        </div>


                        <!-- PROGRESS -->

                        <div
                            id="uploadStatus"
                            class="alert alert-info d-none">

                            Preparing upload...

                        </div>


                        <div
                            class="progress mb-3 d-none"
                            id="progressContainer">

                            <div
                                id="progressBar"
                                class="progress-bar progress-bar-striped progress-bar-animated"
                                role="progressbar"
                                style="width: 0%">

                                0%

                            </div>

                        </div>


                        <!-- HIDDEN CLOUDINARY URLS -->

                        <input
                            type="hidden"
                            name="video_url"
                            id="videoUrl">

                        <input
                            type="hidden"
                            name="thumbnail_url"
                            id="thumbnailUrl">


                        <button
                            type="submit"
                            id="uploadButton"
                            class="btn btn-danger w-100">

                            🚀 Upload Video

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const form = document.getElementById("uploadForm");

const videoFile = document.getElementById("videoFile");

const thumbnailFile = document.getElementById("thumbnailFile");

const videoUrl = document.getElementById("videoUrl");

const thumbnailUrl = document.getElementById("thumbnailUrl");

const uploadButton = document.getElementById("uploadButton");

const uploadStatus = document.getElementById("uploadStatus");

const progressContainer = document.getElementById("progressContainer");

const progressBar = document.getElementById("progressBar");


function showStatus(message, type = "info") {

    uploadStatus.className = "alert alert-" + type;

    uploadStatus.textContent = message;

    uploadStatus.classList.remove("d-none");

}


async function getSignature() {

    const response = await fetch("/cloudinary_signature");

    if (!response.ok) {

        throw new Error("Could not get Cloudinary signature.");

    }

    return await response.json();

}


function uploadToCloudinary(file, signatureData, resourceType) {

    return new Promise((resolve, reject) => {

        const xhr = new XMLHttpRequest();

        const uploadUrl =
            `https://api.cloudinary.com/v1_1/${signatureData.cloud_name}/${resourceType}/upload`;


        xhr.open("POST", uploadUrl);


        xhr.upload.addEventListener("progress", function(event) {

            if (event.lengthComputable) {

                const percent =
                    Math.round((event.loaded / event.total) * 100);

                progressBar.style.width = percent + "%";

                progressBar.textContent = percent + "%";

            }

        });


        xhr.onload = function() {

            if (xhr.status >= 200 && xhr.status < 300) {

                const result = JSON.parse(xhr.responseText);

                resolve(result);

            }
            else {

                reject(
                    new Error(
                        "Cloudinary upload failed: " +
                        xhr.responseText
                    )
                );

            }

        };


        xhr.onerror = function() {

            reject(
                new Error("Network error while uploading.")
            );

        };


        const formData = new FormData();

        formData.append("file", file);

        formData.append(
            "api_key",
            signatureData.api_key
        );

        formData.append(
            "timestamp",
            signatureData.timestamp
        );

        formData.append(
            "signature",
            signatureData.signature
        );


        xhr.send(formData);

    });

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const video = videoFile.files[0];

    const thumbnail = thumbnailFile.files[0];


    if (!video) {

        alert("Please select a video.");

        return;

    }


    if (!thumbnail) {

        alert("Please select a thumbnail.");

        return;

    }


    try {

        uploadButton.disabled = true;

        progressContainer.classList.remove("d-none");


        // ==========================
        // GET SIGNATURE
        // ==========================

        showStatus(
            "🔐 Preparing secure Cloudinary upload..."
        );

        const signatureData = await getSignature();


        // ==========================
        // UPLOAD VIDEO
        // ==========================

        showStatus(
            "🎥 Uploading video directly to Cloudinary..."
        );

        progressBar.style.width = "0%";

        progressBar.textContent = "0%";


        const videoResult =
            await uploadToCloudinary(
                video,
                signatureData,
                "video"
            );


        videoUrl.value = videoResult.secure_url;


        // ==========================
        // UPLOAD THUMBNAIL
        // ==========================

        showStatus(
            "🖼 Uploading thumbnail..."
        );


        progressBar.style.width = "0%";

        progressBar.textContent = "0%";


        const thumbnailSignature =
            await getSignature();


        const thumbnailResult =
            await uploadToCloudinary(
                thumbnail,
                thumbnailSignature,
                "image"
            );


        thumbnailUrl.value =
            thumbnailResult.secure_url;


        // ==========================
        // SEND ONLY TEXT + URLS
        // ==========================

        showStatus(
            "💾 Saving video information..."
        );


        form.submit();

    }
    catch (error) {

        console.error(error);

        showStatus(
            "❌ Upload failed: " + error.message,
            "danger"
        );

        uploadButton.disabled = false;

    }

});

</script>


</body>

</html>

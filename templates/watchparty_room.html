<!DOCTYPE html>
<html>

<head>

    <title>Watch Party Room</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body class="{{ 'dark-theme' if session.get('theme')=='dark' else 'light-theme' }}">

<div class="container mt-5">

<div class="card shadow mb-4">

    <div class="card-header bg-danger text-white">

        <h2 class="mb-0">
            🎥 Watch Party Room
        </h2>

    </div>

    <div class="card-body">

    <h5>
        Room ID:
        <span class="badge bg-success">
            {{ room_id }}
        </span>
    </h5>

    <div class="alert alert-info">

    <strong>Invite Link:</strong>

    <input 
    class="form-control mt-2"
    value="{{ join_link }}"
    id="inviteLink"
    readonly>

    <button 
    class="btn btn-primary mt-2"
    onclick="copyLink()">

    📋 Copy Link

    </button>

</div>

</div>


<div class="card shadow mb-4">

<div class="card-body">

<p class="mb-0">

Welcome,

        <strong>{{ username }}</strong>

        {% if username == host %}
            <span class="badge bg-danger">
                👑 Host
            </span>
        {% endif %}

    </p>

</div>

</div>


<div class="card shadow mb-4">

<div class="card-body">

<h3 class="text-danger">
🎬 {{ video.title }}
</h3>

<p class="text-muted">
{{ video.description }}
</p>

<div class="ratio ratio-16x9 shadow rounded mb-3">

<video
    id="videoPlayer"
    width="100%"
    {% if username == host %}
    controls
    {% endif %}>

    <source
    src="{{ video.filename }}"
    type="video/mp4">

    Your browser does not support video.

</video>

</div>
 
</div>

</div>

</div>
    

   <div class="card shadow mb-4">

<div class="card-header bg-dark text-white">

<h4 class="mb-0">
📹 Video Call
</h4>

</div>

<div class="card-body">

    <div class="row">

        <div class="col-md-6">

            <video
                id="myVideo"
                autoplay
                muted
                playsinline
                class="border rounded w-100">
            </video>

            <p class="text-center mt-2">
                You
            </p>

        </div>

        <div class="col-md-6">

            <video
                id="remoteVideo"
                autoplay
                playsinline
                class="border rounded w-100">
            </video>

           <p class="text-center mt-2">

    {% if username == host %}
        Participant
    {% else %}
        👑 Host
    {% endif %}

</p>
        </div>

    </div>

    <div class="mt-3">

        <button
            id="startCall"
            class="btn btn-success">

            📞 Start Camera

        </button>

        <button
            id="toggleMic"
            class="btn btn-warning">

            🎤 Mute

        </button>

        <button
            id="toggleCamera"
            class="btn btn-secondary">

            📷 Camera Off

        </button>

        <button
            id="leaveCall"
            class="btn btn-danger">

            ❌ Leave Call

        </button>

        <button
    id="shareScreen"
    class="btn btn-info">

    🖥 Share Screen

</button>

    </div>

    <hr>

    </div>

</div>

    <div class="row">


<div class="col-md-5">


<div class="card shadow mb-4">

<div class="card-header bg-primary text-white">

<h4 class="mb-0">
👥 Participants
</h4>

</div>

<div class="card-body">

    <ul
        id="participantList"
        class="list-group mb-4">
    </ul>

    </div>

</div>

</div>

    <div class="col-md-7">

<div class="card shadow mb-4">

<div class="card-header bg-success text-white">

<h4 class="mb-0">
💬 Chat
</h4>

</div>

<div class="card-body">

    <div
        id="messages"
        class="border rounded p-3 mb-3 bg-white"
        style="height:300px; overflow-y:auto;">
    </div>

    <div class="input-group">

        <input
            id="message"
            class="form-control"
            placeholder="Type a message...">

        <button
            class="btn btn-primary"
            onclick="sendMessage()">

            Send

        </button>

        </div>

</div>

</div>

</div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>

<script>

const socket = io();

const isHost = {{ 'true' if username == host else 'false' }};

const roomId = "{{ room_id }}";

const username = "{{ username }}";

const video = document.getElementById("videoPlayer");

const myVideo = document.getElementById("myVideo");

const remoteVideo = document.getElementById("remoteVideo");

let localStream = null;
let peerConnection = null;

const configuration = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

function createPeerConnection() {

    peerConnection = new RTCPeerConnection(configuration);

    // Receive the other participant's video
    peerConnection.ontrack = function(event) {

        remoteVideo.srcObject = event.streams[0];

    };

    // Send ICE candidates to the other user
    peerConnection.onicecandidate = function(event) {

        if (event.candidate) {

            socket.emit("ice_candidate", {

                room: roomId,

                candidate: event.candidate

            });

        }

    };

    // Debugging
    peerConnection.onconnectionstatechange = function() {

        console.log("Connection State:", peerConnection.connectionState);

    };

    peerConnection.oniceconnectionstatechange = function() {

        console.log("ICE State:", peerConnection.iceConnectionState);

    };

}

document.getElementById("startCall").addEventListener("click", async function () {

    try {

        // Get camera and microphone
        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        // Show your own video
        myVideo.srcObject = localStream;

        // Create connection only once
        if (!peerConnection) {
            createPeerConnection();
        }

        // Add your camera and microphone to the connection
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        // Only the host creates the offer
        if (isHost) {

            const offer = await peerConnection.createOffer();

            await peerConnection.setLocalDescription(offer);

            socket.emit("offer", {
                room: roomId,
                offer: offer
            });

        }

    }
    catch (error) {

        console.error(error);

        alert("Unable to access camera or microphone.");

    }

});

socket.on("offer", async function(data){

    // Host already created the offer
    if (isHost) return;

    // Create connection if it doesn't exist
    if (!peerConnection){
        createPeerConnection();
    }

    // Start camera if it hasn't been started yet
    if (!localStream){

        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        myVideo.srcObject = localStream;

        localStream.getTracks().forEach(track=>{
            peerConnection.addTrack(track, localStream);
        });

    }

    // Accept the host's offer
    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(data.offer)
    );

    // Create an answer
    const answer = await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    // Send answer back to host
    socket.emit("answer",{
        room: roomId,
        answer: answer
    });

});

socket.on("answer", async function(data){

    // Only the host receives the answer
    if (!isHost) return;

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(data.answer)
    );

});

socket.on("ice_candidate", async function(data){

    if(peerConnection){

        try{

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(data.candidate)
            );

        }
        catch(error){

            console.error(error);

        }

    }

});

// Join the watch party room
socket.emit("join", {

    room: roomId,

    username: username

});

socket.on("message", function(data){

    document.getElementById("messages").innerHTML += `
        <div class="alert alert-info">
            ${data.msg}
        </div>
    `;

});

socket.on("update_participants", function(data){

    const participantList = document.getElementById("participantList");

    participantList.innerHTML = "";

    data.participants.forEach(function(name){

        const li = document.createElement("li");

        li.className = "list-group-item";

        if(name === data.host){
            li.innerHTML = "👑 " + name;
        }
        else{
            li.innerHTML = "👤 " + name;
        }

        participantList.appendChild(li);

    });

});

function sendMessage(){

    const message = document.getElementById("message").value.trim();

    if(message === ""){
        return;
    }

    socket.emit("send_message",{

        room: roomId,

        username: username,

        message: message

    });

    document.getElementById("message").value = "";

}

socket.on("receive_message", function(data){

    document.getElementById("messages").innerHTML += `
        <div class="alert alert-secondary">
            <strong>${data.username}:</strong>
            ${data.message}
        </div>
    `;

    // Auto-scroll to the latest message
    const messages = document.getElementById("messages");
    messages.scrollTop = messages.scrollHeight;

});

if (isHost) {

    video.addEventListener("play", function(){

        socket.emit("play_video",{

            room: roomId,

            currentTime: video.currentTime

        });

    });

    video.addEventListener("pause", function(){

        socket.emit("pause_video",{

            room: roomId,

            currentTime: video.currentTime

        });

    });

    video.addEventListener("seeked", function(){

        socket.emit("seek_video",{

            room: roomId,

            currentTime: video.currentTime

        });

    });

}

document.getElementById("toggleMic").addEventListener("click", function(){

    if(!localStream) return;

    const audioTrack = localStream.getAudioTracks()[0];

    audioTrack.enabled = !audioTrack.enabled;

    this.innerHTML = audioTrack.enabled
        ? "🎤 Mute"
        : "🔇 Unmute";

});

document.getElementById("toggleCamera").addEventListener("click", function(){

    if(!localStream) return;

    const videoTrack = localStream.getVideoTracks()[0];

    videoTrack.enabled = !videoTrack.enabled;

    this.innerHTML = videoTrack.enabled
        ? "📷 Camera Off"
        : "📷 Camera On";

});

document.getElementById("leaveCall").addEventListener("click", function(){

    if(localStream){

        localStream.getTracks().forEach(track => track.stop());

    }

    if(peerConnection){

        peerConnection.close();

        peerConnection = null;

    }

    myVideo.srcObject = null;

    remoteVideo.srcObject = null;

    socket.emit("leave",{

        room: roomId,

        username: username

    });

});

document.getElementById("shareScreen").addEventListener("click", async function(){

    if(!peerConnection){

        alert("Start the camera first.");

        return;

    }

    try{

        const screenStream = await navigator.mediaDevices.getDisplayMedia({

            video: true

        });

        const screenTrack = screenStream.getVideoTracks()[0];

        myVideo.srcObject = screenStream;

        const sender = peerConnection.getSenders().find(function(sender){

            return sender.track && sender.track.kind === "video";

        });

        if(sender){

            sender.replaceTrack(screenTrack);

        }

        screenTrack.onended = function(){

            if(localStream){

                myVideo.srcObject = localStream;

                const cameraTrack = localStream.getVideoTracks()[0];

                sender.replaceTrack(cameraTrack);

            }

        };

    }

    catch(error){

        console.log(error);

    }

});

socket.on("play_video", function(data){

    video.currentTime = data.currentTime;

    video.play().catch(function(error){

        console.log(error);

    });

});

socket.on("pause_video", function(data){

    video.currentTime = data.currentTime;

    video.pause();

});

socket.on("seek_video", function(data){

    video.currentTime = data.currentTime;

});

window.addEventListener("beforeunload", function(){

    socket.emit("leave",{

        room: roomId,

        username: username

    });

});

function copyLink(){

    const link = document.getElementById("inviteLink");

    navigator.clipboard.writeText(link.value);

    alert("Watch Party link copied!");

}

</script>

</body>

</html>

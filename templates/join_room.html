<!DOCTYPE html>
<html>

<head>

<title>Join Watch Party</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body class="{{ 'dark-theme' if session.get('theme')=='dark' else 'light-theme' }}">

<div class="container mt-5">


<div class="card shadow p-5">


<h2 class="text-center">
🚪 Join Watch Party
</h2>


<p class="text-center text-muted">
Enter the Room ID shared by your friend.
</p>


<form method="POST">


<label class="mt-3">
Room ID
</label>


<input 
type="text"
name="room_id"
class="form-control"
placeholder="Example: a8b92c1f"
required>


<button class="btn btn-primary w-100 mt-4">

Join Room

</button>


</form>


</div>


</div>


</body>

</html>
